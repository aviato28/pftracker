name: Release

# Builds the Android APKs and publishes a GitHub Release whenever
# pubspec.yaml's version changes — that's what AppUpdateService checks
# (GET /repos/.../releases/latest) for the in-app updater to find. Can
# also be triggered manually from the Actions tab.
on:
  push:
    branches:
      - claude/lucid-keller-sybjpy
    paths:
      - pubspec.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - run: flutter pub get

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up release signing key
        if: steps.check.outputs.exists == 'false'
        # Without this, `android/app/build.gradle.kts` falls back to the
        # debug keystore — which the Android SDK auto-generates fresh
        # (different random key) on every runner, so every release would
        # get a different signing certificate and Android would refuse to
        # install any of them as an "update" over the last ("app not
        # installed"). These secrets are written to gitignored files that
        # only ever exist in this ephemeral runner, never committed.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/pftracker-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=pftracker-release.jks
          EOF

      - name: Build release APKs
        if: steps.check.outputs.exists == 'false'
        # Without -P force-version-code-ignoring-abi=true, --split-per-abi
        # multiplies each APK's versionCode by its ABI (arm64 becomes
        # 2000+N) — fine for the Play Store, but it breaks AppUpdateService's
        # plain buildNumber comparison against pubspec.yaml's `+N`.
        run: flutter build apk --release --split-per-abi -P force-version-code-ignoring-abi=true

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/*-release.apk
